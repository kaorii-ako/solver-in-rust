[workspace]
resolver = "2"
members = ["crates/core", "crates/geom", "crates/lbm", "crates/aero", "crates/io-vtk", "crates/app", "crates/cli", "crates/tui", "crates/gui", "crates/fusion"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
cfd-core = { path = "crates/core" }
cfd-geom = { path = "crates/geom" }
cfd-lbm = { path = "crates/lbm" }
cfd-aero = { path = "crates/aero" }
cfd-io-vtk = { path = "crates/io-vtk" }
cfd-app = { path = "crates/app" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
anyhow = "1"
approx = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
